<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rio Tri Prayogo | Portfolio</title>
    <link rel="icon" type="image/png" href="./img/logo.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #0d0d0d 0%, #141414 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.6s ease-out;
      }

      #loading-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .loader-content {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }

      .loader-logo {
        width: 120px;
        height: 120px;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.6;
          transform: scale(0.95);
        }
      }

      .loader-text {
        color: #888880;
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        animation: fadeInOut 2s ease-in-out infinite;
      }

      @keyframes fadeInOut {
        0%,
        100% {
          opacity: 0.5;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="loader-content">
        <img src="./img/logo.png" alt="Loading" class="loader-logo" />
        <span class="loader-text">Loading portfolio...</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
