<!doctype html>
<html lang="en">
  <head>

    <style>

        margin: 0;

      }
      body {
        background: #0d0d0d;

        color: #c8b89a;

        font-size: 14px;

        color: #0d0d0d;
        background: #c8b89a;
        text-decoration: none;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 14px 28px;
        transition: opacity 0.2s ease;
      }
      a:hover {
        opacity: 0.85;
      }
